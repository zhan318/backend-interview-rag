[project]
name = "growth-companion"
version = "1.0.0"
description = "后端面经 RAG Agent — 基于 FastAPI + RAG + Function Calling 的个人知识库问答与模拟面试系统"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # 行长度由 formatter 处理
    "B008",   # FastAPI Depends() 中函数调用是合法的
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint.isort]
known-first-party = ["agent", "auth", "chatbot", "config", "knowledge", "memory", "tools", "utils"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["frontend/", ".venv/", "__pycache__/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# 默认带覆盖率：本地跑一次就能看到"哪一行没被测到"。
# 门槛（--cov-fail-under）只放在 CI 里 —— 本地单跑某个文件时覆盖率天然很低，
# 不适合作为失败条件。
addopts = "-q --cov --cov-report=term-missing:skip-covered"

# ── 覆盖率口径 ──
# 只统计产品代码：测试自身、评测/压测脚本、前端产物不计入分母，
# 否则覆盖率会被人为拉高（或拉低），失去作为质量门禁的意义。
[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "eval/*",
    "performance-test/*",
    "frontend/*",
    "node_modules/*",
    ".venv/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
skip_covered = true          # 只打印未全覆盖的文件，输出更聚焦
show_missing = true          # 标出未覆盖行号，方便补用例
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
