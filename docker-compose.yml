version: "3.9"

services:
  app:
    build: .
    container_name: growth-companion
    ports:
      - "8000:8000"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-}
      - GLM_API_KEY=${GLM_API_KEY:-}
      - GLM_MODEL=${GLM_MODEL:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-glm}
      - FALLBACK_LLM_PROVIDER=${FALLBACK_LLM_PROVIDER:-deepseek}
      - OBSIDIAN_VAULT_DIR=${OBSIDIAN_VAULT_DIR:-}
      - OBSIDIAN_EXCLUDE=${OBSIDIAN_EXCLUDE:-API.md}
      - OBSIDIAN_WRITE_BLOCK=${OBSIDIAN_WRITE_BLOCK:-API.md}
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_EXPIRE_HOURS=${JWT_EXPIRE_HOURS:-24}
    volumes:
      # 知识库文档（上传的 PDF/TXT/MD）
      - ./knowledge/docs:/app/knowledge/docs
      # SQLite 数据库（对话历史、用户）
      - ./memory:/app/memory
      # Chroma 向量存储
      - ./knowledge/chroma_db:/app/knowledge/chroma_db
      # Obsidian vault（如在本机，映射进去）
      - ${OBSIDIAN_VAULT_DIR:-/tmp/empty_vault}:/vault:ro
    restart: unless-stopped
    healthcheck:
      # 必须用 /health/live：/health 默认虽已轻量化，但存活探针只该验证进程可响应，
      # 不依赖任何外部组件（原实现 /health 会加载 BGE 模型 28s，配 5s timeout 必挂）
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      # 首次启动要做 Obsidian 增量索引，给足冷启动时间再开始判活
      start_period: 60s

  # 可选：本地验证指标用。默认不启动，按需 `docker compose --profile monitoring up`
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: growth-companion-prometheus
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    depends_on:
      - app
    restart: unless-stopped

volumes:
  prometheus_data:
